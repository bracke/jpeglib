name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  complete-check:
    name: library-complete checklist (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      ALIRE_NONINTERACTIVE: "true"
    strategy:
      fail-fast: false
      matrix:
        # Match hostkit's supported runner set. macos-15-intel is deliberate:
        # gnat_native=15.2.1 is pinned through Alire and is not available for
        # the arm64 macOS runner.
        os: [ubuntu-latest, macos-15-intel, windows-latest]
    steps:
      - name: Check out jpeglib
        uses: actions/checkout@v7
        with:
          path: jpeglib

      - name: Check out sibling crates (transitive pin closure)
        uses: bracke/project_tools/.github/actions/checkout-ada-siblings@main
        with:
          root: jpeglib

      - name: Set up Alire
        uses: alire-project/setup-alire@v6
        with:
          toolchain: gnat_native=15.2.1 gprbuild=25.0.1

      - name: Raise Alire solver timeout so slow runners get a complete solution
        shell: bash
        run: alr settings --global --set solver.timeout 600

      - name: Refresh platform-local Alire locks
        shell: bash
        run: |
          alr --non-interactive update gnat_native
          cd tests
          alr --non-interactive update gnat_native

      - name: Install Linux workflow dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick libaunit-dev \
            || sudo apt-get install -y ffmpeg imagemagick libaunit22-dev \
            || sudo apt-get install -y ffmpeg imagemagick libaunit24-dev
          if ! command -v magick >/dev/null 2>&1; then
            convert_path="$(command -v convert)"
            printf '#!/usr/bin/env sh\nexec "%s" "$@"\n' "$convert_path" | sudo tee /usr/local/bin/magick >/dev/null
            sudo chmod +x /usr/local/bin/magick
          fi
          magick -version

      - name: Install macOS workflow dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew update
          brew install ffmpeg imagemagick
          magick -version

      - name: Install Windows workflow dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ffmpeg imagemagick -y --no-progress
          $magick = Get-ChildItem -Path "${env:ProgramFiles}\ImageMagick-*" -Filter magick.exe -Recurse |
            Select-Object -First 1
          if ($null -eq $magick) {
            throw "ImageMagick magick.exe was not installed"
          }
          $magick.Directory.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $magick.FullName -version

      - name: Build library
        working-directory: jpeglib
        shell: bash
        run: alr --non-interactive build

      - name: Build tests and tools
        working-directory: jpeglib/tests
        shell: bash
        run: alr --non-interactive build

      - name: Install GNATprove
        shell: bash
        run: |
          alr install gnatprove
          echo "$HOME/.alire/bin" >> "$GITHUB_PATH"

      - name: Run library-complete checks
        working-directory: jpeglib
        shell: bash
        run: |
          if [ -f tests/bin/jpeglib_complete.exe ]; then
            alr exec -- tests/bin/jpeglib_complete.exe
          else
            alr exec -- tests/bin/jpeglib_complete
          fi
